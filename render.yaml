services:
  - type: web
    name: repomind-backend
    env: docker
    dockerContext: .
    dockerfilePath: ./docker/Dockerfile.backend
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: auto
      - key: PORT
        value: 8000
